[project]
name = "triton-runner"
description = "Multi-Level Triton Runner supporting Python, IR, PTX, and cubin."

requires-python = ">=3.10"

dependencies = [
    "triton>=3.0.0,<3.9",
    "termcolor",
]

readme = "README.md"
version = "0.3.8"
authors = [
    { name = "Bob Huang", email = "x@bobhuang.xyz" },
]
license = "MIT"

[project.urls]
repository = "https://github.com/toyaix/triton-runner"
homepage = "https://github.com/toyaix/triton-runner"

[build-system]
# SPDX license expressions need setuptools >= 77
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[project.optional-dependencies]
tvm-ffi = [
    "apache-tvm-ffi==0.1.14.post0",
]

[tool.setuptools.package-data]
# README.md is a symlink to the root README, so the packaged copy always
# matches it; builds dereference the symlink into real file content.
"triton_runner" = ["README.md"]
"triton_runner.bench" = ["LICENSE"]
"triton_runner.tvm_ffi" = ["generic_launcher.cc"]

[tool.setuptools.packages.find]
include = ["triton_runner*"]
