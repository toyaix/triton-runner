[project]
name = "triton-runner"
description = "Multi-Level Triton Runner supporting Python, IR, PTX, and cubin."

dependencies = [
    "triton>=3.0.0",
    "termcolor",
]

readme = "README.md"
version = "0.3.8"
authors = [
    { name = "Bob Huang", email = "x@bobhuang.xyz" },
]
license = "MIT"

[project.urls]
repository = "https://github.com/toyaix/triton-runner"
homepage = "https://github.com/toyaix/triton-runner"

[build-system]
# SPDX license expressions (license = "MIT") need setuptools >= 77; 77.0.3 is the
# packaging guide's recommended floor for the new table format.
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[project.optional-dependencies]
tvm-ffi = [
    "apache-tvm-ffi==0.1.11",
]

[tool.setuptools.package-data]
"triton_runner" = ["README.md"]
"triton_runner.tvm_ffi" = ["generic_launcher.cc"]

[tool.setuptools.packages.find]
include = ["triton_runner*"]
